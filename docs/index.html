<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poster Audio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%232f5bd3'/%3E%3Cpath d='M9.5 7.5v9l7-4.5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #15181d;
    --muted: #5d6573;
    --line: #e2e5ea;
    --accent: #2f5bd3;
    --accent-ink: #ffffff;
    --accent-soft: #e8eefc;
    --shadow: 0 -6px 24px rgba(20, 24, 32, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --surface: #1b1e24;
      --text: #eceef2;
      --muted: #9aa2b1;
      --line: #2c3038;
      --accent: #7c9cff;
      --accent-ink: #0d1020;
      --accent-soft: #232b45;
      --shadow: 0 -6px 24px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 16px 200px;
  }
  .venue {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(22px, 6vw, 30px);
    line-height: 1.25;
    text-wrap: balance;
  }
  .authors { margin: 0; font-weight: 500; }
  .affiliation { margin: 0; color: var(--muted); font-size: 15px; }
  .transcript-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 32px 0 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .transcript-head h2 {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .transcript-head span { font-size: 13px; color: var(--muted); }
  #transcript p {
    margin: 0;
    padding: 12px 14px;
    border-radius: 10px;
    transition: background-color .25s, color .25s;
  }
  #transcript.synced p { cursor: pointer; color: var(--muted); }
  #transcript.synced p.current { background: var(--accent-soft); color: var(--text); }
  .error { color: #c0392b; }

  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .player-inner {
    max-width: 680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    align-items: center;
  }
  #play {
    grid-row: span 2;
    width: 64px; height: 64px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #play:disabled { opacity: .5; cursor: default; }
  #play svg { width: 28px; height: 28px; fill: currentColor; }
  #play .icon-pause { display: none; }
  #play.playing .icon-play { display: none; }
  #play.playing .icon-pause { display: block; }
  input[type=range] {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
    height: 28px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .speeds { display: flex; gap: 4px; }
  .speeds button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 3px 9px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .speeds button[aria-pressed=true] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
</style>
</head>
<body>
<main>
  <p class="venue" id="venue"></p>
  <h1 id="title">Loading…</h1>
  <p class="authors" id="authors"></p>
  <p class="affiliation" id="affiliation"></p>

  <div class="transcript-head">
    <h2>Transcript</h2>
    <span id="hint"></span>
  </div>
  <div id="transcript"></div>
</main>

<div class="player">
  <div class="player-inner">
    <button id="play" aria-label="Play" disabled>
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
    <div class="row">
      <span><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
      <div class="speeds" role="group" aria-label="Playback speed">
        <button data-rate="0.75">0.75×</button>
        <button data-rate="1" aria-pressed="true">1×</button>
        <button data-rate="1.25">1.25×</button>
        <button data-rate="1.5">1.5×</button>
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const audio = $("audio"), play = $("play"), seek = $("seek"), transcript = $("transcript");
  const fmt = (s) => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, "0")}`;
  };

  // meta.json は毎回取り直す。version を audio / script の URL に付けて、差し替え後に古いキャッシュが出ないようにする
  let meta = {};
  try {
    meta = await (await fetch("meta.json", { cache: "no-store" })).json();
  } catch (e) { console.warn("meta.json の読み込みに失敗", e); }
  const v = encodeURIComponent(meta.version ?? Date.now());

  if (meta.title) document.title = meta.title;
  $("title").textContent = meta.title || "Poster Audio";
  $("venue").textContent = meta.venue || "";
  $("authors").textContent = meta.authors || "";
  $("affiliation").textContent = meta.affiliation || "";

  let paras = [];
  try {
    const res = await fetch(`script.txt?v=${v}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = (await res.text()).replace(/\r\n/g, "\n");
    paras = text.split(/\n\s*\n/).map((p) => p.trim().replace(/\s+/g, " ")).filter(Boolean);
  } catch (e) {
    transcript.innerHTML = '<p class="error">Transcript could not be loaded.</p>';
  }
  const nodes = paras.map((t) => {
    const p = document.createElement("p");
    p.textContent = t;
    transcript.appendChild(p);
    return p;
  });

  audio.src = `audio.mp3?v=${v}`;
  play.disabled = false;

  // tts.py が書いた段落の開始秒が、実際の音声の長さと一致するときだけハイライトを有効にする
  // （mp3 を手で差し替えた場合はずれるので無効にして、原稿の表示だけにする）
  let segments = null;
  audio.addEventListener("loadedmetadata", () => {
    $("dur").textContent = fmt(audio.duration);
    seek.disabled = false;
    const s = meta.segments;
    if (Array.isArray(s) && s.length === nodes.length && nodes.length > 1 &&
        Math.abs((meta.duration || 0) - audio.duration) < 1.0) {
      segments = s;
      transcript.classList.add("synced");
      $("hint").textContent = "Tap a paragraph to jump";
      nodes.forEach((p, i) => p.addEventListener("click", () => {
        audio.currentTime = segments[i];
        if (audio.paused) audio.play();
      }));
    }
  });
  audio.addEventListener("error", () => {
    $("dur").textContent = "—";
    play.disabled = true;
    $("hint").textContent = "Audio could not be loaded";
  });

  play.addEventListener("click", () => (audio.paused ? audio.play() : audio.pause()));
  audio.addEventListener("play", () => { play.classList.add("playing"); play.setAttribute("aria-label", "Pause"); });
  audio.addEventListener("pause", () => { play.classList.remove("playing"); play.setAttribute("aria-label", "Play"); });

  let dragging = false;
  seek.addEventListener("input", () => {
    dragging = true;
    $("cur").textContent = fmt((seek.value / 1000) * audio.duration);
  });
  seek.addEventListener("change", () => {
    audio.currentTime = (seek.value / 1000) * audio.duration;
    dragging = false;
  });

  let current = -1;
  audio.addEventListener("timeupdate", () => {
    const t = audio.currentTime;
    $("cur").textContent = fmt(t);
    if (!dragging && audio.duration) seek.value = Math.round((t / audio.duration) * 1000);
    if (!segments) return;
    let idx = 0;
    while (idx + 1 < segments.length && t >= segments[idx + 1]) idx++;
    if (idx !== current) {
      nodes[current]?.classList.remove("current");
      nodes[idx].classList.add("current");
      current = idx;
      if (!audio.paused) nodes[idx].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });

  document.querySelectorAll(".speeds button").forEach((b) => b.addEventListener("click", () => {
    audio.playbackRate = Number(b.dataset.rate);
    document.querySelectorAll(".speeds button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
})();
</script>
</body>
</html>
